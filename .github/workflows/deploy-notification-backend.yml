name: Deploy notification backend

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Apply database updates and deploy notification functions
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: supabase/setup-cli@v3
        with:
          version: v2.stable

      - name: Check deployment settings
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_CONNECTION_ENCRYPTION_KEY: ${{ secrets.TELEGRAM_CONNECTION_ENCRYPTION_KEY }}
        run: |
          set -euo pipefail
          : "${SUPABASE_ACCESS_TOKEN:?Add the Supabase access token secret}"
          : "${SUPABASE_DB_PASSWORD:?Add the Supabase database password secret}"
          : "${SUPABASE_PROJECT_REF:?Add the Supabase project reference variable}"
          : "${SUPABASE_SERVICE_ROLE_KEY:?Add the service role key secret}"
          : "${TELEGRAM_CONNECTION_ENCRYPTION_KEY:?Add the Telegram encryption key secret}"

      - name: Apply pending database migrations
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          database_url="$(python3 - <<'PY'
          import os
          from urllib.parse import quote

          project_ref = os.environ["SUPABASE_PROJECT_REF"]
          password = quote(os.environ["SUPABASE_DB_PASSWORD"], safe="")
          pooler_host = "aws-1-ap-southeast-1.pooler.supabase.com"
          print(f"postgresql://postgres.{project_ref}:{password}@{pooler_host}:5432/postgres")
          PY
          )"
          supabase db push --db-url "$database_url" --yes

      - name: Set server-only function secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_CONNECTION_ENCRYPTION_KEY: ${{ secrets.TELEGRAM_CONNECTION_ENCRYPTION_KEY }}
        run: |
          set -euo pipefail
          supabase secrets set \
            SUPABASE_SERVICE_ROLE_KEY="$SUPABASE_SERVICE_ROLE_KEY" \
            TELEGRAM_CONNECTION_ENCRYPTION_KEY="$TELEGRAM_CONNECTION_ENCRYPTION_KEY" \
            --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy notification functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          supabase functions deploy manage-telegram-account --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy dispatch-notification --project-ref "$SUPABASE_PROJECT_REF"
